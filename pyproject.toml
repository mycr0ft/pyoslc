[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyoslc"
version = "0.2.0"
description = "SDK for implementing OSLC API using Python."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "Contact Software", email = "fp@contact.de"},
]
keywords = ["OSLC", "SDK", "REST", "API", "RDF", "JSON-LD"]
classifiers = [
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Build Tools",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved",
    "Operating System :: OS Independent",
]
dependencies = [
    "python-dotenv>=1.0.0",
    "RDFLib>=7.0.0",
    "Flask>=3.0,<4.0",
    "Flask-RESTx>=1.3.0",
    "Flask-CORS>=4.0.0",
    "Flask-WTF>=1.2.0",
    "Flask-SQLAlchemy>=3.1.0",
    "Flask-Login>=0.6.0",
    "cachelib>=0.13.0",
    "Authlib>=1.0,<2.0",
    "requests>=2.31.0",
    "Werkzeug>=3.0,<4.0",
    "flask-bootstrap>=3.3.7.1",
    "pyshacl>=0.31.0",
    "pyoxigraph>=0.4.0",
]

[project.optional-dependencies]
dotenv = ["python-dotenv"]
dev = ["check-manifest"]
test = ["pytest>=8.0", "pytest-cov", "pytest-html"]
docs = ["sphinx"]

[dependency-groups]
dev = ["flake8"]

[project.urls]
"Bug Reports" = "https://github.com/cslab/pyoslc/issues"
"Source" = "https://github.com/cslab/pyoslc"

[tool.setuptools.packages.find]
include = ["pyoslc*", "app*"]

[tool.setuptools.package-data]
"app" = ["api/adapter/static/*", "api/adapter/dialogs/static/*", "api/adapter/dialogs/templates/*", "web/templates/*"]
"pyoslc_oauth" = ["templates/*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
filterwarnings = [
    "ignore::pytest.PytestUnknownMarkWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["pyoslc", "pyoslc_oauth", "tests"]

[tool.coverage.paths]
source = ["pyoslc", "pyoslc_oauth"]

[tool.flake8]
max-line-length = 120
exclude = ["docs/*", "tests/*"]
per-file-ignores = """
    pyoslc/resources/domains/rm.py: F401
"""
