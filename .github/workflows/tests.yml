# pyoslc adapter tests — run the functional/unit suite on every push.
#
# The suite needs the stepper package (P2 STEP-domain seeder imports it
# for the seed_from_step_file tests); installed from the sibling repo
# checkout. requirements.txt is reference-only (see pyproject.toml).

name: Testing the Adapter

on: [push]

jobs:
  tests:
    name: test py${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Install stepper (sibling project, P2 seeder dep)
        run: pip install git+https://github.com/mycr0ft/stepper.git

      - name: Run tests
        run: pytest tests/ -q --tb=short